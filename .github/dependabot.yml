version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      eslint:
        patterns:
          - eslint
          - eslint-*
          - '@eslint/*'
          - typescript-eslint
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
          - '@testing-library/*'
          - jsdom
      types:
        patterns:
          - '@types/*'
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
